      size: 869345852
      nfiles: 400
    params:
      eeg_win_stack/config/params.toml:
        model:
          name: tcn
          final_conv_length: auto
          dropout: 0.1
          deep4:
            activation: elu
            batch_norm_alpha: 0.1
            n_filters_time: 25
            n_filters_spat: 25
            filter_time_length: 10
            pool_time_length: 3
            pool_time_stride: 3
            n_filters_2: 50
