schema: '2.0'
stages:
  preprocess:
    cmd: uv run python -m eeg_win_stack.pipeline.preprocess
    params:
      eeg_win_stack/config/params.toml:
        data:
          use_tuab: true
          use_tueg: false
          n_tuab: 2993
          n_tueg: 50
          n_load: 100
          preload: false
          tuab_path: E:/TUAB
          tueg_path: ''
          save_recordings: true
          save_recordings_path: ./target/saved_recordings
          save_windows: true
          save_windows_path: ./target/saved_windows
          load_saved_recordings: true
          load_saved_windows: false
          relabel_datasets: ''
          relabel_labels: ''
        preprocessing:
          bandpass_filter: false
          low_cut_hz: 4.0
          high_cut_hz: 38.0
          standardization: true
          factor_new: 0.001
          init_block_size: 1000
          max_abs_val: 800
          sampling_freq: 100
        run:
          mne_log_level: WARNING
          n_repetitions: 1
          random_state: 87
          n_jobs: 8
          use_azure_artifacts: false
          azure_artifact_root: 
            wasbs://mlflow-artifacts@medshedeegwinstack.blob.core.windows.net/experiments
          experiment_name: eeg_win_stack
        windowing:
          window_len_s: 60
          multiple: 0
          tmin: 300
          sec_to_cut: 60
          duration_recording_sec: 1200
          channels:
          - EEG FP1-REF
          - EEG FP2-REF
          - EEG F3-REF
          - EEG F4-REF
          - EEG C3-REF
          - EEG C4-REF
          - EEG P3-REF
          - EEG P4-REF
          - EEG O1-REF
          - EEG O2-REF
          - EEG F7-REF
          - EEG F8-REF
          - EEG T3-REF
          - EEG T4-REF
          - EEG T5-REF
          - EEG T6-REF
          - EEG FZ-REF
          - EEG PZ-REF
          - EEG CZ-REF
    outs:
