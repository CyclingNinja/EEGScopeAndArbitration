stages:
  preprocess:
    cmd: uv run python -m eeg_win_stack.pipeline.preprocess
    params:
      - eeg_win_stack/config/params.toml:
          - data
          - preprocessing
          - windowing
          - run
    outs:
      - target/saved_windows:
          cache: true

  train:
    cmd: uv run python -m eeg_win_stack.pipeline.train
    deps:
      - ./target/saved_windows
    params:
      - eeg_win_stack/config/params.toml:
          - split
          - training
          - model
          - run
    outs:
      - target/saved_models/window_model:
          cache: true

  evaluate:
    cmd: uv run python -m eeg_win_stack.pipeline.evaluate
    deps:
      - .\target\saved_windows
      - target/saved_models/window_model
    params:
      - eeg_win_stack/config/params.toml:
          - output.training_detail_path
          - split
          - model
          - run
    metrics:
      - metrics.json:
          cache: false
    outs:
      - target/training_detail:
          cache: false
  
  decision:
    cmd: uv run python -m eeg_win_stack.pipeline.decision
    deps:
      - target/training_detail
    params:
      - eeg_win_stack/config/params.toml:
          - decision
          - output.decision_models_path
          - run
    outs:
      - target/decision_results.csv:
          cache: false
      - target/saved_models/decision_model:
          cache: true
    metrics:
      - target/decision_metrics.json:
          cache: false
